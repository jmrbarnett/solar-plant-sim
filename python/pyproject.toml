[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plantsim"
version = "0.3.0"
description = "Solar plant telemetry simulator"
requires-python = ">=3.12"
dependencies = ["mariadb>=1.1", "python-dotenv>=1.0", "pymodbus>=3.16,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "asyncua>=1.1"]

[project.scripts]
plantsim = "plantsim.main:run"              # creates a `plantsim` command
plantsim-field = "plantsim.main:run_field"  # field devices only (Modbus server)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
